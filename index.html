
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Metroidvania</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game-container">
        <canvas id="game" width="960" height="540">
            Your browser does not support HTML Canvas.
        </canvas>

        <div id="game-ui">
            <div class="game-title">THE UNKNOWN</div>
            <div class="controls">
                A / D — Move<br>
                SPACE — Jump<br>
                R — Restart
            </div>
            <div id="status">Exploration</div>
        </div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
